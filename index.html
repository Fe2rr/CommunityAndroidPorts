<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Android Ports</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <button id="menu-button" type="button">
        ☰
    </button>

    <h1>Community Android Ports</h1>
    <p>List of Native Android ports made by the Community</p>

</header>

<div id="menu-overlay"></div>

<nav id="side-menu">

    <button id="menu-close" type="button">
        ×
    </button>

    <h2>Categories</h2>

    <div id="platform-list"></div>

</nav>

<main>

    <div class="search-container">
        <input
            type="text"
            id="search"
            placeholder="Search game..."
            autocomplete="off"
        >
    </div>

    <div id="status">
        Loading games...
    </div>

    <div id="game-list"></div>

    <p class="game-files-link">
        Game files available
        <a
            href="https://docs.google.com/spreadsheets/d/1wXlykMGC7rQCgebOkA4Awtd4wN9nMHCTkZUFf4KHQ-k/edit?usp=drivesdk"
            target="_blank"
            rel="noopener noreferrer"
        >
            here
        </a>
    </p>

</main>

<footer>
    <p>Community Android Ports</p>
</footer>

<script src="app.js"></script>

</body>
</html>
