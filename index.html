<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Android Ports</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Community Android Ports</h1>
    <p>Lista de ports y versiones de juegos para Android</p>
</header>

<main>

    <div class="search-container">
        <input
            type="text"
            id="search"
            placeholder="Buscar juego..."
            autocomplete="off"
        >
    </div>

    <div id="status">
        Cargando juegos...
    </div>

    <div id="game-list"></div>

</main>

<footer>
    <p>Community Android Ports</p>
</footer>

<script src="app.js"></script>

</body>
</html>
